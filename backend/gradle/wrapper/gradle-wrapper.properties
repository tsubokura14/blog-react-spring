# ダウンロードしたGradle配布物の展開先ベースディレクトリ（GRADLE_USER_HOME = ~/.gradle）
distributionBase=GRADLE_USER_HOME
# GRADLE_USER_HOME配下でGradle配布物を展開するパス
distributionPath=wrapper/dists
# 使用するGradleのバージョンと配布物（bin=実行用最小構成 / all=ソース・ドキュメント含む）の取得先URL
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
# 配布物ダウンロード時のネットワークタイムアウト（ミリ秒）
networkTimeout=10000
# ダウンロード失敗時のリトライ回数（0はリトライしない）
retries=0
# リトライ間の待機時間（ミリ秒）
retryBackOffMs=500
# distributionUrlの妥当性検証（Gradleの正規配布物か）を行うかどうか
validateDistributionUrl=true
# ダウンロードしたzip（配布物アーカイブ）自体の保存先ベースディレクトリ
zipStoreBase=GRADLE_USER_HOME
# GRADLE_USER_HOME配下でzipを保存するパス
zipStorePath=wrapper/dists
